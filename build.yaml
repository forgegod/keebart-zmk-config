# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
---
include:
  - board: corne_choc_pro_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne_choc_pro_bt_left
  - board: corne_choc_pro_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: corne_choc_pro_bt_right

  - board: corne_choc_pro_5col_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne_choc_pro_bt_5col_left
  - board: corne_choc_pro_5col_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: corne_choc_pro_bt_5col_right

  - board: corne_choc_pro_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: corne_choc_pro_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  # --- Corne Choc Pro DE: German umlauts via the zmk-unicode module --------
  # Identical hardware to the Corne Choc Pro, but the default keymap adds a
  # dedicated DE layer. The stock settings_reset firmware above also works for
  # these boards, so no extra reset targets are needed.
  - board: corne_choc_pro_de_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne_choc_pro_de_left
  - board: corne_choc_pro_de_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: corne_choc_pro_de_right

  - board: corne_choc_pro_de_5col_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: corne_choc_pro_de_5col_left
  - board: corne_choc_pro_de_5col_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: corne_choc_pro_de_5col_right

  # --- DE targets: German umlauts via the zmk-unicode module -----------------
  # These are hardware aliases with an additional DE keymap layer. The stock
  # settings_reset firmware for each base keyboard also covers its DE target.
  - board: piantor_pro_bt_de_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: piantor_pro_bt_de_left
  - board: piantor_pro_bt_de_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: piantor_pro_bt_de_right

  - board: piantor_pro_bt_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: piantor_pro_bt_left
  - board: piantor_pro_bt_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: piantor_pro_bt_right

  - board: piantor_pro_bt_5col_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: piantor_pro_bt_5col_left
  - board: piantor_pro_bt_5col_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: piantor_pro_bt_5col_right

  - board: piantor_pro_bt_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: piantor_pro_bt_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart

  - board: sofle_choc_pro_de_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sofle_choc_pro_de_left
  - board: sofle_choc_pro_de_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: sofle_choc_pro_de_right

  - board: sofle_choc_pro_left
    snippet: studio-rpc-usb-uart
    shield: sharp_mip
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: sofle_choc_pro_bt_left
  - board: sofle_choc_pro_right
    shield: sharp_mip
    snippet: studio-rpc-usb-uart
    artifact-name: sofle_choc_pro_bt_right

  - board: sofle_choc_pro_left
    shield: settings_reset
    snippet: studio-rpc-usb-uart
  - board: sofle_choc_pro_right
    shield: settings_reset
    snippet: studio-rpc-usb-uart
